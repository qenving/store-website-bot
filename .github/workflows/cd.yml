name: CD Pipeline - Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip post-deploy tests'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pre-deploy-checks:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pre-deploy checks
        run: npm run predeploy:check
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}

      - name: Validate Kubernetes manifests
        run: npm run k8s:validate

      - name: Validate environment variables
        run: npm run validate:env:prod

  build-and-push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, bot, worker, store, gateway]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.service }}
        run: npm run build:${{ matrix.service }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Discord Store Bot - ${{ matrix.service }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  database-migration:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate:prod
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}

  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push-images, database-migration]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://store.yourproduction.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update image tags in manifests
        run: |
          find kubernetes/ -name "*.yaml" -type f -exec sed -i \
            "s|image: ghcr.io/.*:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/\${SERVICE}:${{ steps.version.outputs.VERSION }}|g" {} \;

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/redis/
          kubectl apply -f kubernetes/api/
          kubectl apply -f kubernetes/bot/
          kubectl apply -f kubernetes/worker/
          kubectl apply -f kubernetes/store/
          kubectl apply -f kubernetes/gateway/
          kubectl apply -f kubernetes/ingress.yaml
          kubectl apply -f kubernetes/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-deployment -n default --timeout=5m
          kubectl rollout status deployment/bot-deployment -n default --timeout=5m
          kubectl rollout status deployment/worker-deployment -n default --timeout=5m
          kubectl rollout status deployment/store-deployment -n default --timeout=5m
          kubectl rollout status deployment/gateway-deployment -n default --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n default
          kubectl get services -n default

  health-check:
    name: Post-Deploy Health Checks
    runs-on: ubuntu-latest
    needs: deploy-kubernetes
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Run health checks
        run: npm run health:check
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          STORE_URL: ${{ secrets.PROD_STORE_URL }}
          GATEWAY_URL: ${{ secrets.PROD_GATEWAY_URL }}
          HEALTH_CHECK_TIMEOUT: 60000

      - name: Run smoke tests on production
        run: npm run test:smoke:prod
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          STORE_URL: ${{ secrets.PROD_STORE_URL }}

      - name: Check error rates
        run: npm run metrics:check
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          ERROR_RATE_THRESHOLD: 0.05

  rollback-on-failure:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Execute rollback
        run: npm run rollback
        env:
          KUBE_NAMESPACE: default

      - name: Notify rollback
        run: npm run notify:rollback
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOYMENT_ID: ${{ github.run_id }}

  notify-deployment:
    name: Notify Deployment Success
    runs-on: ubuntu-latest
    needs: [deploy-kubernetes, health-check]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Send deployment notification
        run: npm run notify:deploy
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOYMENT_VERSION: ${{ steps.version.outputs.VERSION }}
          DEPLOYMENT_ENV: ${{ github.event.inputs.environment || 'production' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
