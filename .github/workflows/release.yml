name: Release Pipeline - Electron Builds & GitHub Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha

env:
  NODE_VERSION: '20.x'

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      release_notes: ${{ steps.notes.outputs.NOTES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Generate version tag
        run: npm run tag:version -- --version ${{ steps.version.outputs.VERSION }}

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(npm run release:notes -- --version ${{ steps.version.outputs.VERSION }})
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release/notes/RELEASE_${{ steps.version.outputs.VERSION }}.md

  build-electron-windows:
    name: Build Electron - Windows
    runs-on: windows-latest
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Build Electron for Windows
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare-release.outputs.version }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
          retention-days: 30

  build-electron-macos:
    name: Build Electron - macOS
    runs-on: macos-latest
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Build Electron for macOS
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare-release.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
          retention-days: 30

  build-electron-linux:
    name: Build Electron - Linux
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Build Electron for Linux
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare-release.outputs.version }}

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/*.deb
          retention-days: 30

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-electron-windows, build-electron-macos, build-electron-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: Release v${{ needs.prepare-release.outputs.version }}
          body_path: release/notes/RELEASE_${{ needs.prepare-release.outputs.version }}.md
          draft: false
          prerelease: ${{ github.event.inputs.release_type != 'stable' }}
          files: |
            artifacts/electron-windows/*.exe
            artifacts/electron-windows/*.exe.blockmap
            artifacts/electron-macos/*.dmg
            artifacts/electron-macos/*.dmg.blockmap
            artifacts/electron-linux/*.AppImage
            artifacts/electron-linux/*.AppImage.blockmap
            artifacts/electron-linux/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-changelog:
    name: Publish Changelog
    runs-on: ubuntu-latest
    needs: create-github-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog
        run: npm run changelog:generate

      - name: Commit changelog
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for v${{ needs.prepare-release.outputs.version }}" || echo "No changes to commit"
          git push

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [prepare-release, create-github-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Discord notification
        run: npm run notify:release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.prepare-release.outputs.version }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'stable' }}

      - name: Send email notification
        if: github.event.inputs.release_type == 'stable'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Discord Store Bot v${{ needs.prepare-release.outputs.version }} Released
          to: ${{ secrets.ADMIN_EMAIL }}
          from: GitHub Actions
          body: |
            A new stable release of Discord Store Bot has been published.

            Version: v${{ needs.prepare-release.outputs.version }}
            Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.prepare-release.outputs.version }}

            Download the latest installers from the release page.
