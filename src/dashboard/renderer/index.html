<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Store Bot - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }
        
        header {
            background: #2d2d2d;
            padding: 15px 20px;
            border-bottom: 2px solid #3d3d3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        header h1 {
            font-size: 20px;
            color: #5865f2;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #43b581;
            animation: pulse 2s infinite;
        }
        
        .status-dot.offline {
            background: #f04747;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .tabs {
            width: 200px;
            background: #2d2d2d;
            border-right: 2px solid #3d3d3d;
            padding: 20px 0;
        }
        
        .tab-btn {
            width: 100%;
            padding: 12px 20px;
            background: none;
            border: none;
            color: #b0b0b0;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        
        .tab-btn:hover {
            background: #3d3d3d;
            color: #e0e0e0;
        }
        
        .tab-btn.active {
            background: #3d3d3d;
            color: #5865f2;
            border-left-color: #5865f2;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #3d3d3d;
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #ffffff;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            background: #3d3d3d;
            padding: 15px;
            border-radius: 6px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: #5865f2;
            color: white;
        }
        
        .btn-primary:hover {
            background: #4752c4;
        }
        
        .btn-danger {
            background: #f04747;
            color: white;
        }
        
        .btn-danger:hover {
            background: #d83c3c;
        }
        
        .btn-warning {
            background: #faa61a;
            color: white;
        }
        
        .btn-warning:hover {
            background: #e89210;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .logs-container {
            background: #1a1a1a;
            border-radius: 6px;
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #2d2d2d;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-timestamp {
            color: #7289da;
            margin-right: 10px;
        }
        
        .log-level {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .log-level.info { background: #43b581; color: white; }
        .log-level.warn { background: #faa61a; color: white; }
        .log-level.error { background: #f04747; color: white; }
        .log-level.debug { background: #747f8d; color: white; }
        
        .log-message {
            color: #e0e0e0;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .control-section {
            background: #3d3d3d;
            padding: 20px;
            border-radius: 6px;
        }
        
        .control-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🤖 Discord Store Bot Dashboard</h1>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>
        
        <div class="main-content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="home">🏠 Home</button>
                <button class="tab-btn" data-tab="logs">📋 Logs</button>
                <button class="tab-btn" data-tab="controls">⚙️ Controls</button>
            </div>
            
            <div class="content">
                <div id="home" class="tab-content active">
                    <div class="card">
                        <h2>Bot Status</h2>
                        <div class="stats-grid" id="statsGrid"></div>
                    </div>
                    
                    <div class="card">
                        <h2>Recent Activity</h2>
                        <div class="logs-container" id="recentLogs">
                            <p style="color: #747f8d;">No recent activity</p>
                        </div>
                    </div>
                </div>
                
                <div id="logs" class="tab-content">
                    <div class="card">
                        <h2>Real-time Logs</h2>
                        <div class="logs-container" id="logsContainer">
                            <p style="color: #747f8d;">Waiting for logs...</p>
                        </div>
                    </div>
                </div>
                
                <div id="controls" class="tab-content">
                    <div class="controls-grid">
                        <div class="control-section">
                            <h3>Bot Control</h3>
                            <button class="btn btn-danger" id="stopBtn">🛑 Stop Bot</button>
                            <button class="btn btn-warning" id="restartBtn">🔄 Restart Bot</button>
                        </div>
                        
                        <div class="control-section">
                            <h3>Maintenance Mode</h3>
                            <button class="btn btn-primary" id="maintenanceBtn">🔧 Toggle Maintenance</button>
                            <p id="maintenanceStatus" style="margin-top: 10px; color: #b0b0b0;">Status: Disabled</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
