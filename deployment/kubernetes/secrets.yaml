# secrets.yaml - Template for Kubernetes secrets
# IMPORTANT: Replace base64 encoded values with actual secrets before applying
# To encode: echo -n 'your-value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: discord-store-secrets
  namespace: discord-store
type: Opaque
data:
  # Discord credentials (base64 encoded)
  DISCORD_TOKEN: <BASE64_ENCODED_TOKEN>
  DISCORD_CLIENT_ID: <BASE64_ENCODED_CLIENT_ID>

  # Database credentials (base64 encoded)
  MYSQL_ROOT_PASSWORD: <BASE64_ENCODED_ROOT_PASSWORD>
  MYSQL_USER: <BASE64_ENCODED_USER>
  MYSQL_PASSWORD: <BASE64_ENCODED_PASSWORD>

  # Redis password (if required)
  REDIS_PASSWORD: <BASE64_ENCODED_REDIS_PASSWORD>

  # Payment Gateway API Keys (base64 encoded)
  STRIPE_SECRET_KEY: <BASE64_ENCODED_STRIPE_KEY>
  PAYPAL_CLIENT_SECRET: <BASE64_ENCODED_PAYPAL_SECRET>

  # Metrics token
  METRICS_TOKEN: <BASE64_ENCODED_METRICS_TOKEN>
