apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bot
  namespace: discord-store
  labels:
    app: discord-bot
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bot
  template:
    metadata:
      labels:
        app: discord-bot
        tier: application
    spec:
      containers:
      - name: bot
        image: discord-store-bot:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: discord-store-config
        - secretRef:
            name: discord-store-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - node
            - -e
            - "process.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - "process.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      restartPolicy: Always
