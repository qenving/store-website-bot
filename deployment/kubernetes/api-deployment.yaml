apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-api
  namespace: discord-store
  labels:
    app: discord-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: discord-api
  template:
    metadata:
      labels:
        app: discord-api
        tier: backend
    spec:
      containers:
      - name: api
        image: discord-store-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: discord-store-config
        - secretRef:
            name: discord-store-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/monitoring/health/liveness
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/monitoring/health/readiness
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: discord-store
  labels:
    app: discord-api
spec:
  type: ClusterIP
  selector:
    app: discord-api
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
