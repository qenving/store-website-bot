apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discord-store-ingress
  namespace: discord-store
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.discord-store.example.com
    - www.discord-store.example.com
    secretName: discord-store-tls
  rules:
  - host: api.discord-store.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 3001
  - host: www.discord-store.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: website-service
            port:
              number: 80
