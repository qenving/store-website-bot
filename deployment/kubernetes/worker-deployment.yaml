apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-worker
  namespace: discord-store
  labels:
    app: discord-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: discord-worker
  template:
    metadata:
      labels:
        app: discord-worker
        tier: worker
    spec:
      containers:
      - name: worker
        image: discord-store-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: discord-store-config
        - secretRef:
            name: discord-store-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - node
            - -e
            - "process.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - "process.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 10
      restartPolicy: Always
