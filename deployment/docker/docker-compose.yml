version: '3.8'

services:
  # Redis - Required for distributed systems
  redis:
    image: redis:7-alpine
    container_name: discord-store-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discord-store-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: discord-store-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discord_store}
      MYSQL_USER: ${MYSQL_USER:-storeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storepassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discord-store-network
    restart: unless-stopped

  # API Server - Multiple instances for load balancing
  api-1:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    container_name: discord-store-api-1
    environment:
      NODE_ENV: production
      API_PORT: 3001
      API_HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discord_store}
      MYSQL_USER: ${MYSQL_USER:-storeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storepassword}
      WORKER_ID: api-1
    ports:
      - "3001:3001"
    depends_on:
      - redis
      - mysql
    networks:
      - discord-store-network
    restart: unless-stopped

  api-2:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    container_name: discord-store-api-2
    environment:
      NODE_ENV: production
      API_PORT: 3001
      API_HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discord_store}
      MYSQL_USER: ${MYSQL_USER:-storeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storepassword}
      WORKER_ID: api-2
    ports:
      - "3002:3001"
    depends_on:
      - redis
      - mysql
    networks:
      - discord-store-network
    restart: unless-stopped

  # Discord Bot - With sharding support
  bot:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.bot
    container_name: discord-store-bot
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discord_store}
      MYSQL_USER: ${MYSQL_USER:-storeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storepassword}
      SHARD_MODE: ${SHARD_MODE:-auto}
    depends_on:
      - redis
      - mysql
      - api-1
    networks:
      - discord-store-network
    restart: unless-stopped

  # Website
  website:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.website
    container_name: discord-store-website
    environment:
      NODE_ENV: production
      WEBSITE_PORT: 3003
      WEBSITE_HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discord_store}
      MYSQL_USER: ${MYSQL_USER:-storeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storepassword}
    ports:
      - "3003:3003"
    depends_on:
      - redis
      - mysql
      - api-1
    networks:
      - discord-store-network
    restart: unless-stopped

  # Workers - Payment processing
  worker-payment:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.worker
    container_name: discord-store-worker-payment
    environment:
      NODE_ENV: production
      WORKER_TYPE: payment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discord_store}
      MYSQL_USER: ${MYSQL_USER:-storeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storepassword}
    depends_on:
      - redis
      - mysql
    networks:
      - discord-store-network
    restart: unless-stopped
    deploy:
      replicas: 2

  # Workers - Reconciliation
  worker-reconciliation:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.worker
    container_name: discord-store-worker-reconciliation
    environment:
      NODE_ENV: production
      WORKER_TYPE: reconciliation
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-discord_store}
      MYSQL_USER: ${MYSQL_USER:-storeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storepassword}
    depends_on:
      - redis
      - mysql
    networks:
      - discord-store-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: discord-store-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - website
    networks:
      - discord-store-network
    restart: unless-stopped

networks:
  discord-store-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  mysql-data:
    driver: local
