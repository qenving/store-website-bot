apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  labels:
    app: discord-store-api
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: discord-store-api
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  sessionAffinity: None
