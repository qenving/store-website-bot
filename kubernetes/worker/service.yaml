apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: default
  labels:
    app: discord-store-worker
    tier: backend
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  selector:
    app: discord-store-worker
  ports:
  - name: metrics
    port: 9091
    targetPort: 9091
    protocol: TCP
