{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "discord-store-bot.fullname" . }}-api
  labels:
    {{- include "discord-store-bot.labels" . | nindent 4 }}
    component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "discord-store-bot.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "discord-store-bot.selectorLabels" . | nindent 8 }}
        component: api
    spec:
      serviceAccountName: {{ include "discord-store-bot.serviceAccountName" . }}
      containers:
      - name: api
        image: {{ include "discord-store-bot.image" (dict "Values" .Values "component" "api" "Chart" .Chart) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.api.service.port }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "discord-store-bot.fullname" . }}-config
        - secretRef:
            name: {{ include "discord-store-bot.fullname" . }}-secrets
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.api.service.port }}
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.api.service.port }}
          initialDelaySeconds: 20
          periodSeconds: 5
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
